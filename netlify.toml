[build]
publish = "."
command = "node tools/fix-public-phone.mjs && node tools/fix-booking-reference.mjs && node tools/refresh-sitemap-lastmod.mjs && node tools/fix-lead-speed.mjs && node tools/fix-new-lead-alert.mjs && node tools/refresh-public-index-signals.mjs && node tools/require-general-booking-deposit.mjs"

[build.environment]
NPM_CONFIG_FETCH_RETRIES = "5"
NPM_CONFIG_FETCH_RETRY_MINTIMEOUT = "20000"
NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT = "120000"
NPM_CONFIG_FETCH_TIMEOUT = "600000"

[build.processing.html]
pretty_urls = true

[functions]
node_bundler = "esbuild"

[functions."submission-created"]
external_node_modules = ["@netlify/database", "drizzle-orm"]

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self)"
Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# DCA Pro code should always revalidate online; the service worker is responsible
# for the offline copy. This prevents an installed phone from pinning an old app
# shell after a production deploy.
[[headers]]
for = "/manager/*"
[headers.values]
Cache-Control = "no-cache, must-revalidate"

# Force crawlers and browsers to revalidate the pages that have had stale phone
# snippets in search, plus the discovery files Google uses to revisit them.
[[headers]]
for = "/"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/contact"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/areas/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sitemap.xml"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/robots.txt"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/wp-admin/*"
to = "/"
status = 404

[[redirects]]
from = "/wp-login.php"
to = "/"
status = 404

[[redirects]]
from = "/xmlrpc.php"
to = "/"
status = 404

[[redirects]]
from = "https://dcacleaningsolutions.com/*"
to = "https://www.dcacleaningsolutions.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://deluxecarpetandairduct.com/*"
to = "https://www.dcacleaningsolutions.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.deluxecarpetandairduct.com/*"
to = "https://www.dcacleaningsolutions.com/:splat"
status = 301
force = true
