<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Line icon set for DCA Cleaning Solutions.
    Reference from any page with:
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#icon-carpet"></use></svg>
    All icons share a 24x24 box, 1.6 stroke width and currentColor so they
    inherit type colour wherever they are placed.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <symbol id="icon-carpet" viewBox="0 0 24 24">
    <path d="M3 6h18v12H3z"/>
    <path d="M7 6v12M11 6v12M15 6v12M19 6v12"/>
    <path d="M3 18l-1 2h20l-1-2"/>
  </symbol>

  <symbol id="icon-duct" viewBox="0 0 24 24">
    <path d="M4 4h9a4 4 0 0 1 4 4v3h3"/>
    <path d="M4 4v6M8 4v6M13 4v6"/>
    <rect x="15" y="14" width="6" height="6" rx="1"/>
    <path d="M16.5 16.5h3M16.5 18.5h3"/>
  </symbol>

  <symbol id="icon-upholstery" viewBox="0 0 24 24">
    <path d="M4 12V9a2 2 0 0 1 4 0v3"/>
    <path d="M16 12V9a2 2 0 0 1 4 0v3"/>
    <path d="M6 12h12v5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/>
    <path d="M9 19v2M15 19v2"/>
