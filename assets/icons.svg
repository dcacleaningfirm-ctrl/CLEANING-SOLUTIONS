    <path d="M10.5 13a3 3 0 0 1 3-3"/>
  </symbol>

  <symbol id="icon-droplet" viewBox="0 0 24 24">
    <path d="M12 3c3.2 3.6 5.5 6.4 5.5 9.4A5.5 5.5 0 0 1 6.5 12.4C6.5 9.4 8.8 6.6 12 3z"/>
    <path d="M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5"/>
  </symbol>

  <symbol id="icon-heat" viewBox="0 0 24 24">
