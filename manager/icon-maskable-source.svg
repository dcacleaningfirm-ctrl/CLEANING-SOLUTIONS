<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DCA Pro Manager">
  <!-- Maskable variant: the background bleeds to every edge because the OS
       clips this to its own shape (circle, squircle, rounded square), and the
       wordmark is kept inside the inner 80% safe zone so no crop can cut it. -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1A365D"/>
  <text x="256" y="272" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="112"
        font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="3">DCA</text>
  <text x="256" y="320" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="31"
        font-weight="bold" fill="#8FA9C9" text-anchor="middle" letter-spacing="4">MANAGER</text>
</svg>
